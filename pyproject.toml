[project]
name = "cmn-c1-016"
version = "1.1.0"
description = "CodeGenerationAgent — AgentCore Template (Cat 1, CMN)"
requires-python = ">=3.11"
dependencies = [
    # `openai` provides AzureOpenAIClient dependencies; `marketplace` provides
    # the runner's PostgreSQL stack (including asyncpg) used by cli.py.
    # Bumped 2026-09-10 from ==1.0.1 to the fleet-standard ==1.0.3 with the
    # full extras set -- confirmed working across the fleet with this exact
    # extras set, and this pin silently overrode the CI-inherited
    # AGENTCORE_WHEEL_SPEC (already 1.0.3 via the shared scaffold CI include)
    # during the editable install.
    "agenticstar-agentcore[marketplace,openai,platform-rag,platform-memory,platform-db,platform-storage-azure]==1.0.3",
    # pyyaml is a real runtime dependency: PB-7 imports it to read config/config.yaml
    # when checking hitl.enabled. Confirmed agenticstar-agentcore's transitive
    # pin is unchanged at ==6.0.1 between 1.0.1 and 1.0.3.
    "pyyaml==6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.1.1",
    "pytest-cov==5.0.0",
    "pytest-asyncio==0.23.6",
    "ruff==0.4.4",
    "mypy==1.10.0",
]

[build-system]
requires = ["setuptools==68.2.2"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
# The published agenticstar-agentcore wheel ships no py.typed marker / stubs
# for framework.*/shared.* — ignore_missing_imports below makes every
# framework/shared symbol resolve to Any, which strict's
# disallow_subclassing_any would otherwise reject for every node/graph class
# in this template (FunctionNode, AgentBaseGraph, AgentState are all
# framework.* base classes). Disabled fleet-wide rather than per-class: it is
# a consequence of the SDK's own missing stubs, not a signal about this
# template's code quality.
disallow_subclassing_any = false

[[tool.mypy.overrides]]
module = ["framework.*", "shared.*", "langchain_openai.*", "yaml.*"]
ignore_missing_imports = true
